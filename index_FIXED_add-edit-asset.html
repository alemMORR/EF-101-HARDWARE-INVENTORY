<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EF101-P11 Hardware Inventory & Maintenance System</title>
<style>
:root{
  --bg:#f4f6f9;--card:#ffffff;--tx:#1b2430;--mut:#667085;--bd:#d9dee6;
  --ac:#1f4e8c;--acx:#ffffff;--ok:#1a7f4b;--bad:#c0392b;--wrn:#a96b00;--hi:#eef3fa;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161c;--card:#1b222b;--tx:#e6eaf0;--mut:#94a0b2;--bd:#2f3946;
    --ac:#6ea8ff;--acx:#0d1520;--ok:#4cc38a;--bad:#ff7b6b;--wrn:#f0b44c;--hi:#222c39;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c;--card:#1b222b;--tx:#e6eaf0;--mut:#94a0b2;--bd:#2f3946;
  --ac:#6ea8ff;--acx:#0d1520;--ok:#4cc38a;--bad:#ff7b6b;--wrn:#f0b44c;--hi:#222c39;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 0;max-width:1100px;margin:auto}
.header-top{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:19px;margin:0}
header p{margin:2px 0 10px;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--bd)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 12px;color:var(--mut);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
main{max-width:1100px;margin:auto;padding:14px 16px 40px}
.grid{display:grid;gap:12px}
.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.card h3{margin:0 0 10px;font-size:15px}
.kpi b{display:block;font-size:28px;line-height:1.1}
.kpi span{color:var(--mut);font-size:13px}
.br{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bl{width:110px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{flex:1;background:var(--hi);height:16px;border-radius:8px;overflow:hidden;position:relative}
.bt i{display:block;height:100%;background:var(--ac);border-radius:8px}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.wrn{color:var(--wrn)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;max-width:100%}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:7px;padding:8px 13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:600;white-space:nowrap}
td.n{white-space:nowrap}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--hi)}
.lnk{background:none;border:0;color:var(--ac);font-weight:700;cursor:pointer;padding:0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 24px;z-index:20}
#modal.hid{display:none}
.box{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:740px}
.box h2{margin:0 0 12px;font-size:18px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fg label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.fg input,.fg select{width:100%;color:var(--tx)}
#err{color:var(--bad);font-size:13px;margin:10px 0;white-space:pre-line}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 12px;font-size:13px}
dt{color:var(--mut)}
dd{margin:0}
textarea{width:100%;height:220px;font:12px/1.4 ui-monospace,Menlo,monospace}
.gd dt{font-weight:700;color:var(--tx)}
.gd{grid-template-columns:1fr;gap:2px}
.gd dd{margin-bottom:10px;color:var(--mut)}
.qr-box{display:flex;gap:16px;align-items:center;background:var(--hi);padding:12px;border-radius:8px;margin-bottom:12px}
.qr-box img{width:100px;height:100px;background:#fff;padding:4px;border-radius:6px;border:1px solid var(--bd)}
.dep-widget{background:var(--hi);padding:12px;border-radius:8px;margin-bottom:12px}
.dep-widget h4{margin:0 0 8px;font-size:13px;color:var(--tx)}
.prog-bar{background:var(--card);height:12px;border-radius:6px;overflow:hidden;border:1px solid var(--bd);margin:6px 0}
.prog-fill{height:100%;background:var(--ac)}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div>
      <h1>EF101-P11: Computer Hardware Inventory & Maintenance System</h1>
      <p>EF-101 Fall 2026 · Lab Asset Register, Maintenance Logs, Dashboard & Analytics</p>
    </div>
  </div>
  <div class="tabs">
    <button data-a="tab" data-v="dash">Dashboard</button>
    <button data-a="tab" data-v="assets">Assets</button>
    <button data-a="tab" data-v="maint">Maintenance log</button>
    <button data-a="tab" data-v="guide">Field guide</button>
  </div>
</header>
<main id="main"></main>
<div id="modal" class="hid"></div>

<script>
const KEY="ef101p11_v2",$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=(n,l)=>String(n).padStart(l,"0"),now=new Date(),TS=now.getFullYear()+"-"+pad(now.getMonth()+1,2)+"-"+pad(now.getDate(),2);
const FAMS=["Intel Core i3","Intel Core i5","Intel Core i7","Intel Core i9","AMD Ryzen 3","AMD Ryzen 5","AMD Ryzen 7","AMD Ryzen 9","Other"],STS=["SSD","NVMe SSD","HDD"],ST=["Operational","Faulty","Under Repair","Retired"],LOCS=["Lab A","Lab B","Admin Office","Server Room","Library"];
const CATS=["Storage","RAM","Power Supply","Cooling","Display","Network","OS/Software","Peripheral"];
const T={Storage:["Disk errors and slow boot","Ran disk check, replaced drive, restored OS image"],RAM:["Random blue screens, memory faults","Reseated and replaced RAM module"],"Power Supply":["PC not powering on","Replaced power supply unit"],Cooling:["Overheating and loud fan","Cleaned dust, replaced fan, new thermal paste"],Display:["No display output","Replaced video cable and reseated GPU"],Network:["No network connectivity","Replaced network cable, reconfigured IP"],"OS/Software":["OS corruption after update","Reinstalled OS and drivers"],Peripheral:["Keyboard or mouse not detected","Replaced peripheral"]};

function seed(){
 const cf=[["Dell OptiPlex 7090","Intel Core i7","Intel Core i7-11700",16,"SSD",512,"Integrated",65000],["HP ProDesk 400 G7","Intel Core i5","Intel Core i5-10500",8,"HDD",1000,"Integrated",45000],["Lenovo ThinkCentre M70","Intel Core i3","Intel Core i3-10100",8,"HDD",500,"Integrated",35000],["Dell Precision 3650","Intel Core i9","Intel Core i9-11900",32,"NVMe SSD",1000,"NVIDIA RTX A2000",180000],["HP EliteDesk 800 G6","Intel Core i7","Intel Core i7-10700",16,"SSD",512,"Integrated",70000],["Custom Build","AMD Ryzen 5","AMD Ryzen 5 5600X",16,"NVMe SSD",512,"NVIDIA GTX 1660",95000],["Lenovo ThinkCentre M90","Intel Core i5","Intel Core i5-11400",16,"SSD",256,"Integrated",55000],["Dell Vostro 3888","Intel Core i3","Intel Core i3-10105",4,"HDD",1000,"Integrated",32000]];
 const bad={4:"Faulty",11:"Faulty",19:"Faulty",7:"Under Repair",26:"Under Repair",13:"Retired"},assets=[];
 for(let i=0;i<32;i++){const c=cf[(i*3+(i>>2))%8],y=2020+i%5,m=i%12+1,d=(i*3)%27+1,pd=y+"-"+pad(m,2)+"-"+pad(d,2);
  assets.push({id:"PC-"+pad(i+1,3),make:c[0],fam:c[1],cpu:c[2],ram:c[3],st:c[4],cap:c[5],gpu:c[6],cost:c[7],os:c[3]<=4?"Windows 10 Pro":i%4==0?"Ubuntu 22.04 LTS":"Windows 11 Pro",ip:i%7==6?"":"192.168.1."+(10+i),loc:LOCS[i%5],pd,wend:(y+(i%3==0?5:3))+"-"+pad(m,2)+"-"+pad(d,2),stat:bad[i+1]||"Operational"})}
 const E=[[7,"2025-11-04","Storage",9500,"Ali Raza"],[7,"2026-03-18","Storage",0,"Ali Raza"],[7,"2026-08-22","Power Supply",6500,"Bilal Ahmed"],[11,"2025-06-10","Storage",8000,"Sana Khan"],[11,"2026-04-02","Storage",8000,"Sana Khan"],[11,"2026-09-15","RAM",4500,"Sana Khan"],[19,"2025-09-12","Cooling",1500,"Bilal Ahmed"],[19,"2026-05-20","Cooling",2200,"Bilal Ahmed"],[19,"2026-10-08","Power Supply",7000,"Ali Raza"],[4,"2026-01-14","Storage",9000,"Ali Raza"],[4,"2026-10-01","Storage",0,"Ali Raza"],[26,"2026-02-09","Display",3500,"Sana Khan"],[26,"2026-10-12","RAM",5000,"Sana Khan"],[2,"2025-05-07","OS/Software",0,"Bilal Ahmed"],[2,"2026-06-30","Storage",8500,"Ali Raza"],[9,"2025-08-19","Network",500,"Sana Khan"],[14,"2026-02-25","Peripheral",1200,"Bilal Ahmed"],[16,"2025-12-03","Cooling",1800,"Ali Raza"],[21,"2026-07-11","OS/Software",0,"Sana Khan"],[23,"2026-03-05","Network",800,"Bilal Ahmed"],[28,"2026-09-02","Storage",7500,"Ali Raza"],[30,"2026-05-14","Peripheral",900,"Sana Khan"],[13,"2025-10-27","Storage",8500,"Ali Raza"],[13,"2026-01-30","Power Supply",6000,"Bilal Ahmed"],[5,"2025-04-16","RAM",4000,"Sana Khan"],[17,"2026-08-05","Display",3000,"Bilal Ahmed"],[1,"2026-06-12","Network",600,"Sana Khan"],[24,"2025-11-21","OS/Software",0,"Ali Raza"]];
 return{assets,events:E.map((e,i)=>({id:"M-"+pad(i+1,3),aid:"PC-"+pad(e[0],3),date:e[1],cat:e[2],desc:T[e[2]][0],action:T[e[2]][1],tech:e[4],cost:e[3]}))}}

function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.assets)&&Array.isArray(d.events))return d}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let S=load(),tab="dash",F={q:"",fam:"",ram:"",st:"",loc:"",stat:"",w:""},MC="",xk="inv";

const wStat=a=>a.wend<TS?"Expired":"Active",dLeft=a=>Math.round((new Date(a.wend+"T00:00:00")-new Date(TS+"T00:00:00"))/864e5);
const evOf=id=>S.events.filter(e=>e.aid===id).sort((a,b)=>b.date.localeCompare(a.date)),get=id=>S.assets.find(a=>a.id===id);
const gpuT=a=>a.gpu||"None",money=n=>"PKR "+Number(n||0).toLocaleString("en-US");
const tally=(arr,fn)=>{const o={};arr.forEach(x=>{const k=fn(x);o[k]=(o[k]||0)+1});return Object.entries(o)};
const bars=r=>{const m=Math.max(1,...r.map(x=>x[1]));return r.length?r.map(x=>`<div class="br"><span class="bl" title="${esc(x[0])}">${esc(x[0])}</span><span class="bt"><i style="width:${x[1]/m*100}%"></i></span><b>${x[1]}</b></div>`).join(""):'<p class="mut">No data</p>'};
const sCls=s=>s==="Operational"?"ok":s==="Retired"?"mut":"bad";

function calcDepreciation(a){
 const pDate=new Date(a.pd+"T00:00:00"),cDate=new Date(TS+"T00:00:00");
 const ageYears=(cDate-pDate)/(1000*60*60*24*365.25);
 const totalLifespanYears=5;
 const origCost=a.cost||50000;
 const remPercent=Math.max(0,100-(ageYears/totalLifespanYears*100));
 const remValue=Math.max(0,origCost*(remPercent/100));
 return {
  ageYears:ageYears.toFixed(1),
  lifespanPct:Math.min(100,(ageYears/totalLifespanYears*100)).toFixed(0),
  remValue:Math.round(remValue),
  origCost
 };
}

function validateIPv4(ip){
 if(!ip) return true;
 const parts=ip.split(".");
 if(parts.length!==4) return false;
 return parts.every(p=>/^\d{1,3}$/.test(p) && Number(p)>=0 && Number(p)<=255);
}

function reasons(a){
 const r=[];if(a.stat==="Faulty")r.push("Faulty");if(a.stat==="Under Repair")r.push("Under repair");
 const d=dLeft(a);if(d>=0&&d<=60)r.push("Warranty ends in "+d+" days");
 const n=evOf(a.id).length;if(n>=3)r.push(n+" maintenance events");return r;
}

function vDash(){
 const act=S.assets.filter(a=>a.stat!=="Retired"),ev=S.events;
 const op=act.filter(a=>a.stat==="Operational").length,fl=act.filter(a=>a.stat==="Faulty"||a.stat==="Under Repair").length,ow=act.filter(a=>wStat(a)==="Expired").length;
 const att=act.map(a=>({a,r:reasons(a)})).filter(x=>x.r.length),ret=S.assets.length-act.length;
 const byA=tally(ev,e=>e.aid).sort((x,y)=>y[1]-x[1]),byC=tally(ev,e=>e.cat).sort((x,y)=>y[1]-x[1]);
 const k=(v,l,c)=>`<div class="card kpi"><b class="${c||""}">${v}</b><span>${l}</span></div>`;
 return`<div class="grid g5">${k(act.length,"Total active assets"+(ret?" ("+ret+" retired)":""))}${k(op,"Operational","ok")}${k(fl,"Faulty / under repair","bad")}${k(ow,"Out of warranty","wrn")}${k(att.length,"Requiring attention","bad")}</div>
 <div class="grid g2" style="margin-top:12px">
 <div class="card"><h3>RAM Size Distribution</h3>${bars(tally(act,a=>a.ram).sort((x,y)=>x[0]-y[0]).map(x=>[x[0]+" GB",x[1]]))}</div>
 <div class="card"><h3>Storage Type Distribution</h3>${bars(tally(act,a=>a.st).sort((x,y)=>y[1]-x[1]))}</div>
 <div class="card"><h3>CPU Family Distribution</h3>${bars(tally(act,a=>a.fam).sort((x,y)=>y[1]-x[1]))}</div>
 <div class="card"><h3>Most Frequently Failing Assets & Categories</h3>${byA.length?`<p style="margin:0 0 8px">Top Asset: <b>${esc(byA[0][0])}</b> (${byA[0][1]} events) · Top Fault: <b>${esc(byC[0][0])}</b> (${byC[0][1]} events)</p><h3 class="mut" style="font-size:13px">Top Assets by Failures</h3>${bars(byA.slice(0,5))}<h3 class="mut" style="font-size:13px;margin-top:10px">Top Fault Categories</h3>${bars(byC.slice(0,5))}`:'<p class="mut">No maintenance events yet.</p>'}</div></div>
 <div class="card" style="margin-top:12px"><h3>Assets Requiring Attention</h3>${att.length?`<div class="sc"><table><tr><th>Asset</th><th>Model</th><th>Location</th><th>Reason</th></tr>${att.map(x=>`<tr><td><button class="lnk" data-a="view" data-v="${esc(x.a.id)}">${esc(x.a.id)}</button></td><td>${esc(x.a.make)}</td><td>${esc(x.a.loc)}</td><td>${x.r.map(esc).join("; ")}</td></tr>`).join("")}</table></div>`:'<p class="mut">Nothing needs immediate attention.</p>'}</div>`}

function filt(){const f=F,q=f.q.toLowerCase();return S.assets.filter(a=>(!q||[a.id,a.make,a.cpu,a.gpu,a.os,a.ip,a.loc].join(" ").toLowerCase().includes(q))&&(!f.fam||a.fam===f.fam)&&(!f.ram||String(a.ram)===f.ram)&&(!f.st||a.st===f.st)&&(!f.loc||a.loc===f.loc)&&(!f.stat||a.stat===f.stat)&&(!f.w||wStat(a)===f.w))}
const sel=(k,l,opts)=>`<select data-f="${k}"><option value="">${l}</option>${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return`<option value="${esc(v)}"${F[k]===String(v)?" selected":""}>${esc(t)}</option>`}).join("")}</select>`;

function vAssets(){const rams=[...new Set(S.assets.map(a=>a.ram))].sort((a,b)=>a-b).map(r=>[String(r),r+" GB"]),locs=[...new Set([...LOCS,...S.assets.map(a=>a.loc)])].sort();
 return`<div class="bar"><input data-f="q" placeholder="Search ID, model, CPU, OS, IP…" value="${esc(F.q)}" style="flex:1;min-width:180px"><button class="btn" data-a="add">+ Add asset</button><button class="btn s" data-a="exp-inv">📥 Download CSV</button><button class="btn s" data-a="exp">View Data</button></div>
 <div class="bar">${sel("fam","CPU family",FAMS)}${sel("ram","RAM size",rams)}${sel("st","Storage type",STS)}${sel("loc","Location",locs)}${sel("stat","Status",ST)}${sel("w","Warranty",["Active","Expired"])}<button class="btn s sm" data-a="clr">Clear</button></div><div class="card"><div id="tbl" class="sc"></div></div>`}

function drawTbl(){const r=filt();$("#tbl").innerHTML=`<p class="mut" style="margin:0 0 8px">${r.length} of ${S.assets.length} assets</p><table><tr><th>ID</th><th>Model</th><th>CPU</th><th>RAM</th><th>Storage</th><th>Location</th><th>Status</th><th>Warranty</th><th></th></tr>${r.map(a=>`<tr><td class="n"><button class="lnk" data-a="view" data-v="${esc(a.id)}">${esc(a.id)}</button></td><td>${esc(a.make)}</td><td>${esc(a.cpu)}</td><td class="n">${a.ram} GB</td><td class="n">${esc(a.st)} ${a.cap} GB</td><td>${esc(a.loc)}</td><td class="${sCls(a.stat)}"><b>${esc(a.stat)}</b></td><td class="${wStat(a)==="Active"?"ok":"wrn"}">${wStat(a)}</td><td class="n"><button class="btn s sm" data-a="edit" data-v="${esc(a.id)}">Edit</button> ${a.stat==="Retired"?`<button class="btn s sm" data-a="react" data-v="${esc(a.id)}">Reactivate</button>`:`<button class="btn s sm" data-a="retire" data-v="${esc(a.id)}">Retire</button>`}</td></tr>`).join("")||'<tr><td colspan="9" class="mut">No matching assets.</td></tr>'}</table>`}

function evTable(list,showA){return`<table><tr><th>Date</th>${showA?"<th>Asset</th>":""}<th>Category</th><th>Fault</th><th>Action taken</th><th>Technician</th><th>Cost</th></tr>${list.map(e=>`<tr><td class="n">${esc(e.date)}</td>${showA?`<td><button class="lnk" data-a="view" data-v="${esc(e.aid)}">${esc(e.aid)}</button></td>`:""}<td>${esc(e.cat)}</td><td>${esc(e.desc)}</td><td>${esc(e.action)}</td><td>${esc(e.tech)}</td><td class="n">${money(e.cost)}</td></tr>`).join("")||`<tr><td colspan="7" class="mut">No maintenance events.</td></tr>`}</table>`}

function vMaint(){const l=S.events.filter(e=>!MC||e.cat===MC).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
 return`<div class="bar"><select data-f="mc"><option value="">All categories</option>${CATS.map(c=>`<option${MC===c?" selected":""}>${c}</option>`).join("")}</select><button class="btn" data-a="log" data-v="">+ Log maintenance event</button><button class="btn s" data-a="exp-mnt">📥 Download CSV</button><button class="btn s" data-a="exp">View Data</button></div><div class="card sc"><p class="mut" style="margin:0 0 8px">${l.length} events · total cost ${money(l.reduce((s,e)=>s+e.cost,0))}</p>${evTable(l,true)}</div>`}

function vGuide(){const g=[["Asset ID","A unique label (e.g. PC-001) for one physical machine. It never changes, ensuring history and warranty claims stay connected to the correct hardware."],["Manufacturer / model","Identifies identical builds, replacement parts, driver compatibility, and reliability trends across batches."],["CPU (and family)","The primary processor. Tracking family and model reveals upgrade cycles and software compatibility."],["GPU","Graphics processing hardware. Dedicated GPUs are essential for CAD, rendering, or AI workloads and dictate asset placement."],["RAM","Short-term volatile memory. Controls multitasking capability; distinct from long-term storage."],["Storage type and capacity","Non-volatile data storage. SSDs/NVMes are fast flash storage; HDDs are mechanical, slower, and prone to mechanical failures."],["Operating system","Defines security update policies, network compatibility, and software support."],["IP address","Logical network identifier. Asset ID tracks the physical box; IP tracks its current network location. Strict IPv4 format (e.g., 192.168.1.50) is enforced."],["Location","Ensures rapid physical location for repairs, departmental audits, and security."],["Purchase date and warranty","Purchase date calculates asset age and 5-year depreciation; warranty status prevents paying for covered repairs."],["Operational status","Operational, Faulty, Under Repair, or Retired. Retiring assets keeps historical maintenance logs intact."],["Maintenance history","Log of faults, repair actions, technician info, and costs. Essential for determining if an asset should be replaced instead of continuously repaired."]];
 return`<div class="card"><dl class="gd">${g.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join("")}</dl></div>`}

function render(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===tab));$("#main").innerHTML=({dash:vDash,assets:vAssets,maint:vMaint,guide:vGuide})[tab]();if(tab==="assets")drawTbl()}
function modal(h){const m=$("#modal");m.innerHTML=`<div class="box">${h}</div>`;m.classList.remove("hid")}const closeM=()=>$("#modal").classList.add("hid");

function viewA(id){
 const a=get(id);if(!a)return;const ev=evOf(id);
 const dep=calcDepreciation(a);
 const qrUrl=`https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(a.id)}`;

 modal(`
 <h2>${esc(a.id)} · ${esc(a.make)}</h2>
 
 <div class="qr-box">
   <img src="${qrUrl}" alt="QR Label for ${esc(a.id)}">
   <div>
     <h4 style="margin:0 0 4px">${esc(a.id)} Asset QR Tag</h4>
     <p style="margin:0;font-size:12px;color:var(--mut)">Scan to quickly reference or log maintenance for this unit.</p>
   </div>
 </div>

 <div class="dep-widget">
   <h4>Asset Lifecycle & Financial Depreciation (5-Yr Lifecycle)</h4>
   <div style="font-size:13px;display:flex;justify-content:space-between;margin-bottom:4px">
     <span>Age: <b>${dep.ageYears} yrs</b></span>
     <span>Est. Value: <b>${money(dep.remValue)}</b> / Orig: ${money(dep.origCost)}</span>
   </div>
   <div class="prog-bar"><div class="prog-fill" style="width:${dep.lifespanPct}%"></div></div>
   <div style="font-size:11px;color:var(--mut);text-align:right">${dep.lifespanPct}% of expected 5-year lifespan used</div>
 </div>

 <dl>
   <dt>Status</dt><dd class="${sCls(a.stat)}"><b>${esc(a.stat)}</b></dd>
   <dt>CPU</dt><dd>${esc(a.cpu)} (${esc(a.fam)})</dd>
   <dt>RAM</dt><dd>${a.ram} GB</dd>
   <dt>Storage</dt><dd>${esc(a.st)}, ${a.cap} GB</dd>
   <dt>GPU</dt><dd>${esc(gpuT(a))}</dd>
   <dt>OS</dt><dd>${esc(a.os)}</dd>
   <dt>IP address</dt><dd>${esc(a.ip||"N/A")}</dd>
   <dt>Location</dt><dd>${esc(a.loc)}</dd>
   <dt>Purchased</dt><dd>${esc(a.pd)}</dd>
   <dt>Warranty</dt><dd>${wStat(a)} (ends ${esc(a.wend)})</dd>
 </dl>
 
 <h3>Maintenance History (${ev.length} events, total cost ${money(ev.reduce((s,e)=>s+e.cost,0))})</h3>
 <div class="sc">${evTable(ev,false)}</div>
 
 <div class="acts">
   <button class="btn s" data-a="close">Close</button>
   <button class="btn s" data-a="edit" data-v="${esc(id)}">Edit</button>
   ${a.stat!=="Retired"?`<button class="btn" data-a="log" data-v="${esc(id)}">+ Log event</button>`:""}
 </div>`);
}

const fld=(n,l,v,x)=>`<label>${l}<input name="${n}" value="${esc(v)}" ${x||""}></label>`,fsel=(n,l,o,v)=>`<label>${l}<select name="${n}">${o.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("")}</select></label>`;

function formA(id){
 const a=id?get(id):{id:"",make:"",fam:FAMS[1],cpu:"",ram:"",st:"SSD",cap:"",gpu:"Integrated",cost:50000,os:"Windows 11 Pro",ip:"",loc:LOCS[0],pd:"",wend:"",stat:"Operational"};
 modal(`<h2>${id?"Edit "+esc(id):"Add Asset"}</h2><form id="af" data-orig="${esc(id||"")}"><div class="fg">${fld("id","Asset ID",a.id,id?"readonly":'placeholder="PC-033"')}${fld("make","Manufacturer / model",a.make)}${fsel("fam","CPU family",FAMS,a.fam)}${fld("cpu","CPU (full name)",a.cpu)}${fld("ram","RAM (GB)",a.ram,'type="number" min="1" step="1"')}${fsel("st","Storage type",STS,a.st)}${fld("cap","Storage capacity (GB)",a.cap,'type="number" min="1" step="1"')}${fld("gpu","GPU (blank = none)",a.gpu)}${fld("cost","Purchase Cost (PKR)",a.cost||50000,'type="number" min="0"')}${fld("os","Operating system",a.os)}${fld("ip","IP address (optional)",a.ip)}${fld("loc","Location",a.loc,'list="ll"')}${fld("pd","Purchase date",a.pd,'type="date"')}${fld("wend","Warranty end date",a.wend,'type="date"')}${fsel("stat","Operational status",ST,a.stat)}</div><datalist id="ll">${LOCS.map(l=>`<option>${l}</option>`).join("")}</datalist><div id="err"></div><div class="acts"><button type="button" class="btn s" data-a="close">Cancel</button><button class="btn">Save Asset</button></div></form>`)
}

function saveA(f){
 const g=n=>f.elements[n].value.trim(),orig=f.dataset.orig,e=[];
 const a={id:g("id").toUpperCase(),make:g("make"),fam:g("fam"),cpu:g("cpu"),ram:Number(g("ram")),st:g("st"),cap:Number(g("cap")),gpu:g("gpu"),cost:Number(g("cost")||0),os:g("os"),ip:g("ip"),loc:g("loc"),pd:g("pd"),wend:g("wend"),stat:g("stat")};
 if(!/^[A-Z0-9-]{3,20}$/.test(a.id))e.push("Asset ID must be 3-20 letters, digits or dashes.");else if(!orig&&get(a.id))e.push("Asset ID already exists.");
 if(!a.make)e.push("Manufacturer / model is required.");if(!a.cpu)e.push("CPU is required.");if(!a.os)e.push("Operating system is required.");if(!a.loc)e.push("Location is required.");
 if(!Number.isInteger(a.ram)||a.ram<1)e.push("RAM must be a positive whole number of GB.");if(!Number.isInteger(a.cap)||a.cap<1)e.push("Storage capacity must be a positive whole number of GB.");
 if(a.ip && !validateIPv4(a.ip)) e.push("IP address must be a valid IPv4 address (e.g. 192.168.1.50).");
 if(!okDate(a.pd))e.push("Purchase date is required.");else if(a.pd>TS)e.push("Purchase date cannot be in the future.");
 if(!okDate(a.wend))e.push("Warranty end date is required.");else if(okDate(a.pd)&&a.wend<a.pd)e.push("Warranty end cannot be before the purchase date.");
 if(e.length){$("#err").textContent=e.join("\n");return}
 if(orig)S.assets[S.assets.findIndex(x=>x.id===orig)]=a;else S.assets.push(a);save();closeM();render();
}

const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+"T00:00:00"));

function formE(id){
 const list=S.assets.filter(a=>a.stat!=="Retired");if(!list.length){modal('<h2>Log event</h2><p>No active assets.</p><div class="acts"><button class="btn s" data-a="close">Close</button></div>');return}
 modal(`<h2>Log Maintenance Event</h2><form id="ef"><div class="fg"><label>Asset<select name="aid">${list.map(a=>`<option value="${esc(a.id)}"${a.id===id?" selected":""}>${esc(a.id)} · ${esc(a.make)}</option>`).join("")}</select></label>${fld("date","Date",TS,'type="date"')}${fsel("cat","Fault category",CATS,"Storage")}${fld("tech","Technician / person","")}${fld("desc","Fault description","")}${fld("action","Action taken","")}${fld("cost","Cost (PKR, 0 if none)","0",'type="number" min="0" step="1"')}<label>Asset status after<select name="stat"><option value="">No change</option><option>Operational</option><option>Faulty</option><option>Under Repair</option></select></label></div><div id="err"></div><div class="acts"><button type="button" class="btn s" data-a="close">Cancel</button><button class="btn">Save Event</button></div></form>`)
}

function saveE(f){
 const g=n=>f.elements[n].value.trim(),e=[],a=get(g("aid")),c=Number(g("cost")||0);
 if(!okDate(g("date")))e.push("Date is required.");else if(g("date")>TS)e.push("Date cannot be in the future.");else if(a&&g("date")<a.pd)e.push("Date cannot be before the asset purchase date.");
 if(!g("desc"))e.push("Fault description is required.");if(!g("action"))e.push("Action taken is required.");if(!g("tech"))e.push("Technician / person is required.");if(!(c>=0))e.push("Cost must be 0 or more.");
 if(e.length){$("#err").textContent=e.join("\n");return}
 const n=Math.max(0,...S.events.map(x=>parseInt(x.id.slice(2))||0))+1;S.events.push({id:"M-"+pad(n,3),aid:g("aid"),date:g("date"),cat:g("cat"),desc:g("desc"),action:g("action"),tech:g("tech"),cost:c});
 if(g("stat"))a.stat=g("stat");save();closeM();render();
}

const cell=v=>{v=String(v??"");return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function csv(k){
 const rows=k==="inv"?[["Asset ID","Manufacturer/Model","CPU Family","CPU","RAM (GB)","Storage Type","Storage (GB)","GPU","Purchase Cost (PKR)","OS","IP","Location","Purchase Date","Warranty End","Warranty Status","Operational Status"],...S.assets.map(a=>[a.id,a.make,a.fam,a.cpu,a.ram,a.st,a.cap,gpuT(a),a.cost||0,a.os,a.ip||"N/A",a.loc,a.pd,a.wend,wStat(a),a.stat])]:[["Event ID","Asset ID","Date","Category","Fault","Action","Technician","Cost (PKR)"],...S.events.map(e=>[e.id,e.aid,e.date,e.cat,e.desc,e.action,e.tech,e.cost])];
 return rows.map(r=>r.map(cell).join(",")).join("\n");
}

function downloadCSV(kind){
 const content=csv(kind);
 const blob=new Blob([content],{type:"text/csv;charset=utf-8;"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=`${kind==='inv'?'inventory':'maintenance'}_${TS}.csv`;
 a.click();
 URL.revokeObjectURL(url);
}

function expM(){modal(`<h2>Export Data</h2><div class="bar"><select data-f="xk"><option value="inv"${xk==="inv"?" selected":""}>Inventory</option><option value="mnt"${xk==="mnt"?" selected":""}>Maintenance events</option></select><button class="btn" data-a="dl-csv">📥 Download .CSV File</button><button class="btn s" data-a="copy">Copy to Clipboard</button></div><textarea id="xt" readonly>${esc(csv(xk))}</textarea><div class="acts"><button class="btn s" data-a="close">Close</button></div>`)}

function conf(t,act,v,lbl){modal(`<h2>${t}</h2><div class="acts"><button class="btn s" data-a="close">Cancel</button><button class="btn d" data-a="${act}" data-v="${esc(v||"")}">${lbl}</button></div>`)}

document.addEventListener("click",e=>{
 if(e.target.id==="modal"){closeM();return}
 const t=e.target.closest("[data-a]");if(!t)return;
 const a=t.dataset.a,v=t.dataset.v;
 if(a==="tab"){tab=v;render()}
 else if(a==="close")closeM();
 else if(a==="view")viewA(v);
 else if(a==="add")formA();
 else if(a==="edit")formA(v);
 else if(a==="log")formE(v);
 else if(a==="retire")conf("Retire "+esc(v)+"? Record and history will be preserved.","doRetire",v,"Retire");
 else if(a==="doRetire"){get(v).stat="Retired";save();closeM();render()}
 else if(a==="react"){get(v).stat="Operational";save();render()}
 else if(a==="clr"){F={q:"",fam:"",ram:"",st:"",loc:"",stat:"",w:""};render()}
 else if(a==="exp")expM();
 else if(a==="exp-inv")downloadCSV("inv");
 else if(a==="exp-mnt")downloadCSV("mnt");
 else if(a==="dl-csv")downloadCSV(xk);
 else if(a==="copy"){const ta=$("#xt");ta.select();try{navigator.clipboard.writeText(ta.value).catch(()=>document.execCommand("copy"))}catch(x){try{document.execCommand("copy")}catch(y){}}t.textContent="Copied!"}
});

document.addEventListener("input",e=>{if(e.target.dataset.f==="q"){F.q=e.target.value;drawTbl()}});
document.addEventListener("change",e=>{const k=e.target.dataset.f;if(!k||k==="q")return;if(k==="mc"){MC=e.target.value;render()}else if(k==="xk"){xk=e.target.value;expM()}else{F[k]=e.target.value;render()}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.matches("#af"))saveA(e.target);else if(e.target.matches("#ef"))saveE(e.target)});

render();
</script>
</body>
</html>
